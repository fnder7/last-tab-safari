name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  extension:
    name: Extension (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test

  core:
    name: Core (Swift)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path "Last Tab/Core"
