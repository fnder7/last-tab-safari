<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <title>Last Tab Settings</title>
  <style>
    html { min-width: 340px; }
    body { font: 13px -apple-system, system-ui, sans-serif; margin: 18px 20px; max-width: 380px; }
    h1 { font-size: 15px; margin: 0 0 16px; display: flex; align-items: center; gap: 8px; }
    h1 img { width: 24px; height: 24px; }
    .row { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 4px 10px; margin: 10px 0; }
    .row label { color: GrayText; }
    .combo {
      font: 15px -apple-system, system-ui, sans-serif; letter-spacing: 0.04em;
      padding: 9px 12px; border-radius: 8px; text-align: center; cursor: pointer;
      border: 1px solid color-mix(in srgb, CanvasText 18%, transparent);
      background: color-mix(in srgb, CanvasText 5%, Canvas); color: CanvasText;
    }
    .combo:hover { background: color-mix(in srgb, CanvasText 9%, Canvas); }
    .combo.recording { outline: 2px solid #0a84ff; color: GrayText; }
    .combo.auto { color: color-mix(in srgb, CanvasText 70%, transparent); }
    .note { grid-column: 2; font-size: 12px; min-height: 0; }
    .note:empty { display: none; }
    .warning { color: #c27c00; }
    .link { grid-column: 2; justify-self: start; font-size: 12px; background: none; border: 0; padding: 0; color: #0a84ff; cursor: pointer; }
    .link[hidden] { display: none; }
    .error { color: #ff453a; min-height: 1.4em; margin-top: 4px; }
    .hint { color: GrayText; line-height: 1.5; margin-top: 8px; }
    .status { margin-top: 14px; padding: 8px 10px; border-radius: 8px; background: color-mix(in srgb, #ff9f0a 16%, Canvas); }
    .status[hidden] { display: none; }
    .status a { color: #0a84ff; }
  </style>
</head>
<body>
  <h1><img src="images/icon-48.png" alt="">Last Tab</h1>
  <div class="row">
    <label for="forward">Forward</label>
    <button class="combo" id="forward" type="button"></button>
    <div class="note warning" id="forward-warning"></div>
  </div>
  <div class="row">
    <label for="reverse">Back</label>
    <button class="combo" id="reverse" type="button"></button>
    <div class="note warning" id="reverse-warning"></div>
    <button class="link" id="reset-reverse" type="button" hidden>Same as forward + ⇧</button>
  </div>
  <div class="error" id="error"></div>
  <div class="hint">Click a shortcut, then press the keys you want. Hold the modifiers and press the key to
    move through tabs; release to switch. Esc cancels.</div>
  <div class="status" id="status" hidden>Last Tab app isn't running — <a href="lasttab://open">Open</a></div>
  <script src="options.js"></script>
</body>
</html>
